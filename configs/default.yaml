input_video: video/001.mp4
output_dir: outputs/001_sam31
device: cuda:7
sampling:
  segmentation_stride: 30
  output_fps: null
camera:
  fx: null
  fy: null
  cx: null
  cy: null
segmentation:
  backend: sam31_sam2
  environment: vbr-seg
  cuda_visible_devices: '7'
  sam3_checkpoint: checkpoints/sam3.1/sam3.1_multiplex.pt
  sam2_checkpoint: checkpoints/sam2/sam2.1_hiera_large.pt
  sam3_threshold: 0.40
  sam3_max_objects: 64
  sam2_offload_state: false
  sam2_dual_anchor: true
  temporal_stabilize: true
  temporal_xor_threshold: 0.06
  temporal_blend_window: 8
  onset_refinement:
    enabled: true
    min_new_area_px: 3500
    persistence_frames: 3
    dilation_px: 9
    cooldown_frames: 15
    lookback_frames: 12
    forward_frames: 6
    overlap_fraction: 0.5
    max_events: 20
  miss_refinement:
    enabled: true
    min_coverage: 0.20
    min_window_frames: 30
    merge_gap_frames: 12
    max_windows: 3
    window_stride: 2
    min_added_area_px: 2000
    min_keep_fraction: 0.5
    # Box seeds: null -> derive per-subwindow boxes from the existing mask
    # blobs (expanded); a list overrides with manual {start, end, box, prompt?}.
    box_seeds: null
    box_subwindow_frames: 25
    box_expansion: 0.4
    max_coverage_increase: 0.15
    evidence_enabled: true
    evidence_dilate_px: 5
    evidence_min_overlap: 0.5
    extra_prompts: [sofa bed, loveseat, futon, armchair, sectional sofa, couch]
    extra_prompt_thresholds:
      sofa bed: 0.30
      loveseat: 0.30
      futon: 0.30
      armchair: 0.30
      sectional sofa: 0.30
      couch: 0.30
  prompts:
    - furniture
    - television
    - rug
    - potted plant
    - lamp
    - decoration
    - clothing
    - bag
    - sofa
    - pillow
    - cushion
    - chair
    - table
    - vase
    - cup
    - bottle
    - table lamp
    - doormat
    - coat rack
    - shelving unit
    - trash can
    - kitchenware
    - refrigerator
    - kitchen cabinet
    - cabinet
    - cupboard
    - sink
    - kitchen counter
    - countertop
    - dresser
    - chest of drawers
    - boxes
    - gray bean bag
    - blanket
    - bicycle
    - book
    - painting
    - gray trash bin
    - gray hamper
    - gray fabric storage basket
  prompt_thresholds:
    gray bean bag: 0.35
    blanket: 0.35
    bicycle: 0.35
    book: 0.35
    painting: 0.35
    gray trash bin: 0.35
    gray hamper: 0.35
    gray fabric storage basket: 0.30
  preserve_prompts: [staircase, stairs, door, window]
  mask_dilation_px: 7
  min_area_px: 150
slam:
  backend: vggt_direct
  environment: vbr-slam
  repo_dir: external/VGGT-SLAM
  cuda_visible_devices: '7'
  checkpoint: checkpoints/vggt/model.pt
  max_frames: 32
  confidence_percentile: 35
  pixel_stride: 2
  voxel_size: 0.025
  # vggt_slam backend options (used when backend: vggt_slam)
  frame_stride: 6
  max_keyframes: 240
  submap_size: 16
  overlap_size: 1
  min_disparity: 50
  conf_threshold: 25
  lc_thres: 0.95
  max_loops: 1
  salad_checkpoint: checkpoints/salad/dino_salad.ckpt
  dinov2_checkpoint: checkpoints/dinov2/dinov2_vitb14_pretrain.pth
  model_mode: square
  mask_aware_matching: true
geometry:
  carve_openings: true
  opening_prompts: [door, window, staircase, stairs]
  voxel_size: 0.03
  plane_distance_threshold: 0.04
  min_plane_points: 1000
  max_planes: 12
  max_walls: 8
  min_wall_width: 0.3
  plan_wall_detection: true
  footprint_wall_fallback: true
  poisson_depth: 8
  mesh_max_points: 150000
  mesh_target_triangles: 250000
  mesh_min_component_triangles: 100
  mesh_fill_hole_max_edges: 60
  use_tsdf: true
  tsdf_trunc: 0.15
  depth_trunc_quantile: 0.995
video_completion:
  backend: propainter
  environment: vbr-seg
  cuda_visible_devices: '7'
  repo_dir: external/ProPainter
  ffmpeg_bin: /usr/bin/ffmpeg
  width: 960
  height: 536
  fp16: true
  # Keep inpaint masks close to the segmentation boundary. ProPainter applies
  # mask_dilation itself; long temporal unions or hull fills over-mask rooms.
  mask_dilation: 8
  mask_close_px: 9
  mask_temporal_radius: 2
  mask_expand_px: 1
  mask_hull_min_area: 0
  mask_hull_max_extra: 0.35
  mask_overlap: 0.12
  # Refinement: clip search ranked n=80 best but OOM on 1799-frame video; 40 is close.
  ref_stride: 10
  neighbor_length: 40
  subvideo_length: 80
  raft_iter: 20
  crf: 18
  preset: medium
  allow_temporal_fallback: true
  temporal_offsets: [15, -15, 30, -30, 60, -60]
  chunks:
    # Full-video n=80 OOMs in a single run; chunked runs keep per-chunk
    # memory bounded and stitch overlapping outputs. Evaluate on the 760-990
    # clip before enabling wholesale.
    enabled: false
    size: 240
    overlap: 60
  temporal_smooth:
    # Flow-aligned 3-frame median inside the inpaint masks; replaces the
    # naive pixel median that smeared texture under camera motion.
    enabled: true
    kernel: 3
gpt:
  enabled: false
  provider: null
  group_size: 8
  endpoint: null
  api_key_env: OPENAI_API_KEY
sfm:
  max_frames: 80
