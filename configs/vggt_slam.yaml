input_video: video/001.mp4
output_dir: outputs/001_sam31_slam
device: cuda:7
sampling:
  segmentation_stride: 30
  output_fps: null
camera:
  fx: null
  fy: null
  cx: null
  cy: null
segmentation:
  backend: sam31_sam2
  environment: vbr-seg
  cuda_visible_devices: '7'
  sam3_checkpoint: checkpoints/sam3.1/sam3.1_multiplex.pt
  sam2_checkpoint: checkpoints/sam2/sam2.1_hiera_large.pt
  sam3_threshold: 0.40
  sam3_max_objects: 64
  sam2_offload_state: false
  sam2_dual_anchor: true
  temporal_stabilize: true
  temporal_xor_threshold: 0.06
  temporal_blend_window: 8
  onset_refinement:
    enabled: true
    min_new_area_px: 3500
    persistence_frames: 3
    dilation_px: 9
    cooldown_frames: 15
    lookback_frames: 12
    forward_frames: 6
    overlap_fraction: 0.5
    max_events: 20
  miss_refinement:
    enabled: true
    min_coverage: 0.20
    min_window_frames: 30
    merge_gap_frames: 12
    max_windows: 3
    window_stride: 2
    min_added_area_px: 2000
    min_keep_fraction: 0.5
    # Box seeds: null -> derive per-subwindow boxes from the existing mask
    # blobs (expanded); a list overrides with manual {start, end, box, prompt?}.
    box_seeds:
      - start: 1550
        end: 1798
        box: [0.13, 0.0, 0.59, 0.5]
        prompt: kitchen wall cabinets
    box_subwindow_frames: 25
    box_expansion: 0.4
    max_coverage_increase: 0.15
    evidence_enabled: true
    evidence_dilate_px: 5
    evidence_min_overlap: 0.5
    extra_prompts: [sofa bed, loveseat, futon, armchair, sectional sofa, couch]
    extra_prompt_thresholds:
      sofa bed: 0.30
      loveseat: 0.30
      futon: 0.30
      armchair: 0.30
      sectional sofa: 0.30
      couch: 0.30
  prompts:
    - furniture
    - television
    - rug
    - potted plant
    - lamp
    - decoration
    - clothing
    - bag
    - sofa
    - pillow
    - cushion
    - chair
    - table
    - vase
    - cup
    - bottle
    - table lamp
    - doormat
    - coat rack
    - shelving unit
    - trash can
    - kitchenware
    - refrigerator
    - kitchen cabinet
    - cabinet
    - cupboard
    - sink
    - kitchen counter
    - countertop
    - dresser
    - chest of drawers
    - boxes
    - gray bean bag
    - blanket
    - bicycle
    - book
    - painting
    - gray trash bin
    - gray hamper
    - gray fabric storage basket
  prompt_thresholds:
    gray bean bag: 0.35
    blanket: 0.35
    bicycle: 0.35
    book: 0.35
    painting: 0.35
    gray trash bin: 0.35
    gray hamper: 0.35
    gray fabric storage basket: 0.30
  preserve_prompts: [staircase, stairs, door, window]
  mask_dilation_px: 7
  min_area_px: 150
slam:
  backend: vggt_slam
  environment: vbr-slam
  repo_dir: external/VGGT-SLAM
  cuda_visible_devices: '7'
  checkpoint: checkpoints/vggt/model.pt
  max_frames: 32
  confidence_percentile: 35
  pixel_stride: 1
  voxel_size: 0.025
  # vggt_slam backend options (used when backend: vggt_slam)
  frame_stride: 4
  max_keyframes: 240
  submap_size: 16
  overlap_size: 1
  min_disparity: 35
  conf_threshold: 25
  lc_thres: 0.95
  model_mode: square
  mask_aware_matching: true
  max_loops: 1
  salad_checkpoint: checkpoints/salad/dino_salad.ckpt
  dinov2_checkpoint: checkpoints/dinov2/dinov2_vitb14_pretrain.pth
geometry:
  carve_openings: true
  opening_prompts: [door, window, staircase, stairs]
  voxel_size: 0.03
  plane_distance_threshold: 0.04
  min_plane_points: 1000
  max_planes: 12
  max_walls: 8
  min_wall_width: 0.3
  plan_wall_detection: true
  footprint_wall_fallback: true
  poisson_depth: 8
  mesh_max_points: 150000
  mesh_target_triangles: 250000
  mesh_min_component_triangles: 100
  mesh_fill_hole_max_edges: 60
  use_tsdf: true
  tsdf_trunc: 0.15
  depth_trunc_quantile: 0.995
video_completion:
  backend: videopainter         # propainter | svor（试验后端）| videopainter（试验分支）
  environment: vbr-seg
  cuda_visible_devices: '7'
  repo_dir: external/ProPainter
  ffmpeg_bin: /usr/bin/ffmpeg
  width: 960
  height: 536
  fp16: true
  svor:
    repo_dir: external/svor
    environment: svor
    cuda_visible_devices: '7'
    model_name: models/Wan2.1-VACE-1.3B
    lora_paths:
      - models/remove_model_stage1.safetensors
      - models/remove_model_stage2.safetensors
    sample_size: "540,960"     # 面积预算；输出按 16 倍数上取整
    chunk_frames: 77           # Wan VAE 要求帧长 4k+1
    overlap: 20
    num_inference_steps: 20
    gpu_memory_mode: model_full_load
    guidance_scale: 6.0
    seed: 43
    dilation: 0
    # svor 专用掩膜膨胀（px）：把掩膜欠覆盖的前景边缘吞进填充区，消除
    # 透传合成暴露的边缘框（与 ProPainter 内部 8px 等效；独立于下方
    # ProPainter 用的 mask_dilation）
    mask_dilation: 8
    weight_dtype: bfloat16
    crf: 18
    preset: medium
    # 生成后处理：掩膜外透传合成（修复墙位漂移/物体闪现）
    # 注意：透传会把物体投影（阴影）也如实贴回背景。若以生成的自然去影为
    # 准（v1 观感），置 false 并配合 wall_ema_alpha 稳定墙面
    composite_source: false
    # 填充区光流 EMA 稳定器（0 关闭）：上一帧结果沿光流 warp 后按权重融入，
    # 让生成结构跟随相机运动而非逐帧重画——消除相邻帧间的填充突变
    fill_ema_alpha: 0.65
    # 无透传时对生成墙面/地面的轻度稳定权重（抑制墙纹逐帧爬行；拖影明显则调低）
    wall_ema_alpha: 0.3
    # 时序平滑关闭：维持原始生成的时序特性（RAFT 光流中值对扩散填充收益
    # 甚微且引入边界扰动；如填充闪烁明显可改回 enabled: true）
    temporal_smooth:
      enabled: false
  # VideoPainter 试验后端（TencentARC，SIGGRAPH 2025）：CogVideoX-5b-I2V +
  # context-control branch + ID-resample LoRA；replace_gt 在隐空间锁定掩膜外
  # 为真实像素（自带透传语义，无墙位漂移）。CogVideoX 为 8fps 720x480 模型：
  # 按 down_sample_stride 时间降采样生成，再由 upsample 运动补偿回源帧率
  videopainter:
    repo_dir: external/videopainter
    environment: /data/lzx/video_background_reconstruction_vp/.conda-vp
    cuda_visible_devices: '4'    # 主流水线约定用 7，试验分支错开
    model_path: external/videopainter/ckpt/CogVideoX-5b-I2V
    branch_path: external/videopainter/ckpt/VideoPainter/VideoPainter/checkpoints/branch
    id_adapter_path: external/videopainter/ckpt/VideoPainter/VideoPainterID/checkpoints
    prompt: "an empty modern kitchen with white walls, a wooden floor, a window and built-in cabinets, no furniture, static camera background"
    height: 480
    width: 720
    window_frames: 49
    window_stride: 29           # 20 帧隐空间重叠平均（抑制窗口接缝突变，同 SVOR 重叠思路）
    down_sample_stride: 3        # 29.97fps → ~10fps（CogVideoX 训练分布为 8fps）
    num_inference_steps: 30
    guidance_scale: 6.0
    prev_clip_weight: 0.5
    seed: 42
    mask_dilate_px: 16           # 源分辨率上的掩膜膨胀（其基准用模型分辨率 32px）
    upsample: minterpolate       # minterpolate | duplicate | none
    crf: 18
    preset: medium
  # Keep inpaint masks close to the segmentation boundary. ProPainter applies
  # mask_dilation itself; long temporal unions or hull fills over-mask rooms.
  mask_dilation: 8
  mask_close_px: 9
  mask_temporal_radius: 2
  mask_expand_px: 1
  mask_hull_min_area: 0
  mask_hull_max_extra: 0.35
  mask_overlap: 0.12
  # Refinement: clip search ranked n=80 best but OOM on 1799-frame video; 40 is close.
  ref_stride: 10
  neighbor_length: 40
  subvideo_length: 80
  raft_iter: 20
  crf: 18
  preset: medium
  allow_temporal_fallback: true
  temporal_offsets: [15, -15, 30, -30, 60, -60]
  chunks:
    # Full-video n=80 OOMs in a single run; chunked runs keep per-chunk
    # memory bounded and stitch overlapping outputs. Evaluate on the 760-990
    # clip before enabling wholesale.
    enabled: false
    size: 240
    overlap: 60
  temporal_smooth:
    # Flow-aligned 3-frame median inside the inpaint masks; replaces the
    # naive pixel median that smeared texture under camera motion.
    enabled: true
    kernel: 3
gpt:
  enabled: false
  provider: null
  group_size: 8
  endpoint: null
  api_key_env: OPENAI_API_KEY
sfm:
  max_frames: 80
